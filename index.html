<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 활용 일지 제출</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); border: 1px solid var(--border); }
    h1 { margin-top: 0; text-align: center; font-size: 1.8rem; margin-bottom: 8px; }
    .sub-title { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }
    .guidance { background-color: #f1f5f9; border-left: 4px solid var(--primary); padding: 12px 16px; font-size: 0.88rem; line-height: 1.5; margin-bottom: 24px; border-radius: 0 6px 6px 0; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); ring: 2px solid #bfdbfe; }
    
    .table-container { overflow-x: auto; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th { background: #f8fafc; border: 1px solid var(--border); padding: 10px; font-size: 0.85rem; text-align: center; }
    td { border: 1px solid var(--border); padding: 8px; vertical-align: top; }
    td textarea { resize: vertical; min-height: 70px; border: 1px solid #cbd5e1; }
    
    .btn-wrap { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    button { cursor: pointer; border-radius: 6px; font-weight: 600; transition: 0.2s; border: none; }
    .btn-add { background: #e2e8f0; color: var(--text); padding: 8px 16px; font-size: 0.9rem; }
    .btn-add:hover { background: #cbd5e1; }
    .btn-remove { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; }
    .btn-remove:hover { background: #fecaca; }
    .btn-submit { background: var(--primary); color: white; padding: 12px 28px; font-size: 1rem; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI 활용 일지</h1>
  <div class="sub-title">Ren'Py 비주얼 노벨 제작 프로젝트 · 매 회차 작성 후 제출</div>

  <div class="guidance">
    <strong>작성 요령:</strong> 가장 오른쪽 칸인 <strong>'내가 고친 부분과 그 이유'</strong>가 실제 평가 대상입니다. AI 결과를 거의 그대로 썼다면 그렇게 적고 이유를 쓰세요. 정직하게 쓴 기록이 잘 꾸민 기록보다 높은 점수를 받습니다.
  </div>

  <form id="journalForm">
    <div class="grid">
      <div class="form-group">
        <label for="round">회차</label>
        <select id="round" required>
          <option value="1">1회차</option>
          <option value="2">2회차</option>
          <option value="3">3회차</option>
          <option value="4">4회차</option>
          <option value="5">5회차</option>
          <option value="6">6회차</option>
          <option value="7">7회차</option>
          <option value="8">8회차</option>
        </select>
      </div>
      <div class="form-group">
        <label for="date">날짜</label>
        <input type="date" id="date" required>
      </div>
      <div class="form-group">
        <label for="studentNumber">학생 번호</label>
        <input type="number" id="studentNumber" placeholder="예: 10" required>
      </div>
      <div class="form-group">
        <label for="studentName">학생 성명</label>
        <input type="text" id="studentName" placeholder="예: 홍길동" required>
      </div>
    </div>

    <div class="table-container">
      <table id="entryTable">
        <thead>
          <tr>
            <th style="width: 18%;">사용 목적</th>
            <th style="width: 25%;">내가 입력한 프롬프트</th>
            <th style="width: 25%;">AI가 준 결과 (요약)</th>
            <th style="width: 28%;">내가 고친 부분과 그 이유</th>
            <th style="width: 4%;"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td><textarea name="purpose" placeholder="예: 선택지 분기 코드 구현" required></textarea></td>
            <td><textarea name="prompt" placeholder="입력한 프롬프트 내용" required></textarea></td>
            <td><textarea name="result" placeholder="AI 응답 요약"></textarea></td>
            <td><textarea name="modification" placeholder="수정한 내용과 선택 이유를 구체적으로 작성" required></textarea></td>
            <td style="text-align: center;"><button type="button" class="btn-remove" onclick="removeRow(this)">삭제</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <button type="button" class="btn-add" onclick="addRow()">+ 기록 행 추가하기</button>

    <div class="btn-wrap">
      <span id="statusMessage" style="font-size: 0.9rem; font-weight: 500;"></span>
      <button type="submit" class="btn-submit" id="submitBtn">구글 시트로 제출하기</button>
    </div>
  </form>
</div>

<script>
  // 🔴 1단계에서 복사한 구글 앱스 스크립트 웹 앱 배포 URL을 여기에 입력하세요.
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUmxJmI9pb5CkEg2hRAsaLA4CjoM6bkqRcTvD1uXk9qB3sNF5XNMiRzUtjNUY-GmhRqg/exec";

  // 오늘 날짜 기본 지정 및 미래 날짜 입력 방지
  const dateInput = document.getElementById("date");
  const today = new Date().toISOString().split("T")[0];
  dateInput.value = today;
  dateInput.max = today; // 오늘 이후 날짜 비활성화

  // 행 추가 함수
  function addRow() {
    const tbody = document.getElementById("tableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><textarea name="purpose" placeholder="예: 배경 화면 전환 효과 연출"></textarea></td>
      <td><textarea name="prompt" placeholder="입력한 프롬프트 내용"></textarea></td>
      <td><textarea name="result" placeholder="AI 응답 요약"></textarea></td>
      <td><textarea name="modification" placeholder="수정한 내용과 선택 이유를 구체적으로 작성"></textarea></td>
      <td style="text-align: center;"><button type="button" class="btn-remove" onclick="removeRow(this)">삭제</button></td>
    `;
    tbody.appendChild(tr);
  }

  // 행 삭제 함수
  function removeRow(btn) {
    const tbody = document.getElementById("tableBody");
    if (tbody.rows.length > 1) {
      btn.closest("tr").remove();
    } else {
      alert("최소 1개의 기록 행은 남아있어야 합니다.");
    }
  }

  // 폼 제출 처리
  document.getElementById("journalForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    if (GAS_WEB_APP_URL.includes("여기에_")) {
      alert("Apps Script 배포 URL을 HTML 파일 상단 GAS_WEB_APP_URL에 먼저 입력해 주세요!");
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMessage");

    submitBtn.disabled = true;
    submitBtn.textContent = "제출 중...";
    statusMsg.style.color = "#475569";
    statusMsg.textContent = "구글 시트에 기록을 전송하고 있습니다...";

    // 데이터 수집
    const rows = document.querySelectorAll("#tableBody tr");
    const records = [];
    rows.forEach(tr => {
      records.push({
        purpose: tr.querySelector('textarea[name="purpose"]').value.trim(),
        prompt: tr.querySelector('textarea[name="prompt"]').value.trim(),
        result: tr.querySelector('textarea[name="result"]').value.trim(),
        modification: tr.querySelector('textarea[name="modification"]').value.trim()
      });
    });

    const payload = {
      round: document.getElementById("round").value,
      date: document.getElementById("date").value,
      studentNumber: document.getElementById("studentNumber").value.trim(),
      studentName: document.getElementById("studentName").value.trim(),
      records: records
    };

    try {
      // CORS 문제 회피를 위해 text/plain 방식 전송 (GAS 내부에서 JSON.parse 수행)
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      
      const result = await res.json();
      if (result.status === "success") {
        statusMsg.style.color = "#16a34a";
        statusMsg.textContent = "성공적으로 구글 시트에 저장되었습니다!";
        alert("일지가 성공적으로 제출되었습니다.");
        // 테이블 내용 초기화 (첫 줄만 남김)
        document.getElementById("journalForm").reset();
        dateInput.value = today;
      } else {
        throw new Error(result.message || "오류 발생");
      }
    } catch (err) {
      console.error(err);
      statusMsg.style.color = "#dc2626";
      statusMsg.textContent = "전송에 실패했습니다. 다시 시도해 주세요.";
      alert("제출 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "구글 시트로 제출하기";
    }
  });
</script>

</body>
</html>
